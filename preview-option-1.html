<!DOCTYPE html>
<html>
<head>
  <title>Option 1 - More Transparent Box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .hero {
      position: relative;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #4a6fa5 0%, #7b9ec8 50%, #a8c5e2 100%);
      background-size: cover;
      background-position: center;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(43, 76, 126, 0.15);
    }
    .fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to bottom, transparent, #F9FAFB);
    }
    .content-box {
      position: relative;
      z-index: 10;
      max-width: 800px;
      width: 100%;
      padding: 32px 48px;
      border-radius: 16px;
      text-align: center;
      background: rgba(249, 250, 251, 0.70);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #F3F4F6;
      border: 2px solid #2B4C7E;
      color: #2B4C7E;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p {
      font-size: 16px;
      font-weight: 500;
      color: #2B4C7E;
      line-height: 1.5;
    }
    .label {
      position: absolute;
      top: 16px;
      left: 16px;
      background: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #2B4C7E;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="label">Option 1: More Transparent Box (70% opacity, heavy blur)</div>
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="overlay"></div>
    <div class="fade"></div>
    <div class="content-box">
      <div class="badge">
        📚 Resources
      </div>
      <h1>Resources & Guides</h1>
      <p>Guides, tools, and resources to help you navigate FMHC with confidence.</p>
    </div>
  </section>
</body>
</html>
