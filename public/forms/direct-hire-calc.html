<!DOCTYPE html>
<html>
<head>
  <title>Direct Hire Calculator Form</title>
</head>
<body>
  <!-- This file exists only for Netlify form detection at build time -->
  <form name="direct-hire-calc" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <p hidden>
      <label>Don't fill this out: <input name="bot-field" /></label>
    </p>
    <input type="hidden" name="form-name" value="direct-hire-calc" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
