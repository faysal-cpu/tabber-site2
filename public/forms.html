<!DOCTYPE html>
<html>
<head>
  <title>Netlify Forms - Hidden</title>
</head>
<body>
  <!-- Hidden form for Netlify detection -->
  <form name="fmhc-contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <select name="care-type">
      <option value="agency">Through a registered agency</option>
      <option value="direct">Directly hiring my own care worker</option>
      <option value="unsure">Not sure yet</option>
    </select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
